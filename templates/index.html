<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Prototype Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="prototype-container">
        <!-- Navigation Bar -->
        <nav class="nav-bar">
            <button id="btn-back" class="nav-btn" title="뒤로가기">← Back</button>
            <button id="btn-comment" class="nav-btn" title="코멘트 토글">💬 Comments</button>
            <button id="btn-xlt" class="nav-btn" title="XLT Key 토글">🔑 XLT Keys</button>

            <select id="language-select" class="nav-select">
                <option value="ko_KR">🇰🇷 한국어</option>
                <option value="en_US">🇺🇸 English</option>
                <option value="ja_JP">🇯🇵 日本語</option>
                <option value="zh_TW">🇹🇼 繁體中文</option>
                <option value="th_TH">🇹🇭 ไทย</option>
            </select>

            <button id="btn-hotspot" class="nav-btn" title="핫스팟 디버그">🎯 Debug</button>
        </nav>

        <!-- Device Frame -->
        <div class="device-frame" id="device-frame">
            <!-- Screen will be injected here -->
            <div id="screen-container" class="screen-container"></div>

            <!-- Hotspots overlay -->
            <div id="hotspots-overlay" class="hotspots-overlay"></div>

            <!-- XLT Key overlay -->
            <div id="xlt-overlay" class="xlt-overlay" style="display: none;"></div>

            <!-- Translation overlay -->
            <div id="translation-overlay" class="translation-overlay" style="display: none;"></div>

            <!-- Comments overlay -->
            <div id="comments-overlay" class="comments-overlay" style="display: none;"></div>

            <!-- Variant states overlay -->
            <div id="variants-overlay" class="variants-overlay"></div>
        </div>

        <!-- Screen Info -->
        <div class="screen-info" id="screen-info">
            <span id="current-screen-name">Loading...</span>
        </div>
    </div>

    <!-- Comment List Panel (fixed, right side) -->
    <aside id="comment-panel" class="comment-panel" style="display: none;">
        <div class="comment-panel-header">💬 코멘트 <span id="comment-panel-count"></span></div>
        <ul id="comment-panel-list" class="comment-panel-list"></ul>
    </aside>

    <!-- Comment Popover (fixed position, outside device frame) -->
    <div id="comment-popover" class="comment-popover" style="display: none;">
        <div class="comment-header">
            <strong id="comment-author"></strong>
            <span id="comment-date"></span>
            <button id="close-comment" class="close-btn">×</button>
        </div>
        <div class="comment-body" id="comment-message"></div>
    </div>

    <!-- Data files -->
    <script src="data.js"></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
